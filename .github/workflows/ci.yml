---
name: CI
"on": [push, pull_request]

permissions:
  id-token: write
  contents: read
  attestations: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  build-linux-arm:
    name: Build / Linux ARM
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        mode: ["fast", "safe", "small", "off"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build binary
        run: |
          zig build --release=${{ matrix.mode }} --verbose --summary all

  build-linux-x86:
    name: Build / Linux X86
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["fast", "safe", "small", "off"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build binary
        run: |
          zig build --release=${{ matrix.mode }} --verbose --summary all

  build-macos:
    name: Build / macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["fast", "safe", "small", "off"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew update
          brew install dbus

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build binary
        run: |
          zig build --release=${{ matrix.mode }} --verbose --summary all

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu, macos]
        mode: ["fast", "safe", "small", "off"]

    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install dbus

      - name: Install dependencies (linux)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Test
        run: zig build test --release=${{ matrix.mode }} --summary all

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    container:
      image: kcov/kcov
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined

    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - run: |
          apt-get update
          apt-get install -y curl gpg git tar xz-utils libdbus-1-dev pkg-config

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - uses: actions/checkout@v6
      - name: Generate coverage
        run: zig build coverage --summary all

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          directory: coverage
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Format
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check .

  release:
    name: Release
    needs: [build-linux-arm, build-linux-x86, build-macos, test]

    permissions:
      contents: write
      id-token: write
      attestations: write
      pages: write

    if: |
      github.repository_owner == 'charlesrocket' &&
      startsWith(github.ref, 'refs/tags/')

    uses: ./.github/workflows/cd.yml
    with:
      tag_name: ${{ github.ref_name }}
